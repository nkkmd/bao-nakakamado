name: v0.10.0 study019 completed results audit
on:
  push:
    branches: ['main', 'research/v010-balance019-20261019']
    paths: ['tools/v010-*/**', 'doc/V010_*', 'doc/v010-*/**', '.github/workflows/v010-*.yml']
  pull_request:
    paths: ['tools/v010-*/**', 'doc/V010_*', 'doc/v010-*/**', '.github/workflows/v010-*.yml']
permissions:
  contents: read
jobs:
  audit019:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reaudit pinned originals with zero new searches
        run: python3 tools/v010-balance019/reaudit.py doc/v010-balance019/completed 5015ee1f968a3ced31a83648524b9ac0132e3369 bf6e7724b663c2918866b5c9637f6547efe7e484 39241595646
      - name: Independent statistics, normal-engine frontier and report reproduction
        run: |
          python3 tools/v010-balance019-results/analyse.py
          node tools/v010-balance019-results/frontier.cjs
          python3 tools/v010-balance019-results/report.py
          git diff --exit-code -- doc/v010-balance019/results-analysis.json doc/v010-balance019/loss-frontier.json doc/V010_BALANCE019_RESULTS_20261020.md
          git diff --exit-code bf6e7724b663c2918866b5c9637f6547efe7e484 -- tools/v010-balance019 tools/v010-balance017 tools/v010-balance018 prototype trials tools/v010-balance tools/v010-followup doc/V010_BALANCE019_PLAN_20261019.md
          git diff --check
