name: v0.10.0 split initial winning-strategy proof study 002
on:
  push:
    branches: ['research/v010-initial-proof-20261012']
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    if: startsWith(github.event.head_commit.message, 'Start v0.10.0 initial proof study 002') && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      roots: ${{ steps.roots.outputs.roots }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tools/v010-certainty/check.test.cjs
      - run: node tools/v010-certainty/study.cjs manifest
      - name: Result branch must already exist at the exact source commit
        run: test "$(git ls-remote origin refs/heads/results/v010-initial-proof-study-002 | cut -f1)" = "$GITHUB_SHA"
      - id: roots
        run: |
          node - <<'JS'
          const fs=require('node:fs'),m=require('./tools/v010-certainty/manifest.json');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'roots='+JSON.stringify(m.roots.map((_,i)=>i))+'\n');
          JS
  proof:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        root: ${{ fromJSON(needs.preflight.outputs.roots) }}
        target: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Complete-response proof from pinned opening or earlier trace
        run: node --max-old-space-size=4096 tools/v010-certainty/study.cjs job "$RUNNER_TEMP/proofs" "${{ matrix.root }}" "${{ matrix.target }}"
      - name: Reuse complete result with zero new exploration
        run: node tools/v010-certainty/study.cjs job "$RUNNER_TEMP/proofs" "${{ matrix.root }}" "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v010-certainty-proof-${{ matrix.root }}-${{ matrix.target }}
          path: ${{ runner.temp }}/proofs/
          retention-days: 90
  aggregate:
    needs: proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: v010-certainty-proof-*
          merge-multiple: true
          path: ${{ runner.temp }}/proofs
      - name: Verify certificates and compose only complete initial quantifiers
        run: node --max-old-space-size=4096 tools/v010-certainty/study.cjs aggregate "$RUNNER_TEMP/proofs"
      - name: Persist proofs on precreated branch with no workflow changes
        env:
          STUDY_SOURCE_SHA: ${{ github.sha }}
          STUDY_RUN_ID: ${{ github.run_id }}
        run: |
          test "$(git ls-remote origin refs/heads/results/v010-initial-proof-study-002 | cut -f1)" = "$GITHUB_SHA"
          python3 tools/v010-followup/archive.py "$RUNNER_TEMP/proofs" doc/v010-certainty
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c results/v010-initial-proof-study-002
          git add doc/v010-certainty
          git commit -m 'Preserve study 002 split opening proofs and exact certificates'
          git push origin HEAD:refs/heads/results/v010-initial-proof-study-002
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v010-certainty-summary
          path: |
            ${{ runner.temp }}/proofs/summary.json
            doc/v010-certainty/
          retention-days: 90
