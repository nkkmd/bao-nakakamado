name: Balance options formal validation
on:
  push:
    branches: [experiment/balance-options-20261001]
    paths:
      - '.github/workflows/balance-options-formal.yml'
permissions:
  contents: read
concurrency:
  group: balance-formal-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  screen:
    name: Formal - ${{ matrix.condition }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        condition: [combined-equal10-613]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Check isolated engine and search
        run: node tools/balance-options/check.cjs tools/balance-options/results/checks.json
      - name: Run condition with separate checkpoints
        run: node tools/balance-options/run.cjs '${{ matrix.condition }}' 'tools/balance-options/results/formal/${{ matrix.condition }}' formal
      - name: Verify any forced-win certificate
        run: node tools/balance-options/certify.cjs 'tools/balance-options/results/formal/${{ matrix.condition }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balance-formal-${{ matrix.condition }}
          path: tools/balance-options/results/
          retention-days: 30
