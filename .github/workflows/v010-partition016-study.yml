name: v0.10.0 targeted 13th-move partition study 016
on:
  push:
    branches: ['research/v010-partition-016-20261018']
permissions:
  contents: read
  actions: read
jobs:
  audits:
    if: startsWith(github.event.head_commit.message, 'Start v0.10.0 partition study 016') && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        command:
          - python3 tools/v010-research-integration/audit.py
          - python3 tools/v010-branch/reaudit.py doc/v010-branch/completed b1e9bdbcab21760c1bd1017c685e0842d02bb85c
          - python3 tools/v010-reply/reaudit.py doc/v010-reply/completed 428cf47b3d27a18e82fef28fa66c66e6cad1c628 975e1a8188dbe43fda1c39b3b97e8858db8a97e3 38265400792
          - python3 tools/v010-deepen/reaudit.py doc/v010-deepen/completed 02335fc03e9ee2ef226c8b226c03d3f8e919456f d4163c3c171117b1fce7dd30b39faad733605418 38271005778
          - python3 tools/v010-pn007/reaudit.py doc/v010-pn007/completed 5f44f34a3a279b232d3045b5b3edaad48096ac0d ce52d57f4a25d40664f1e12de8559691577af1c0 38313259149
          - python3 tools/v010-retro008/reaudit.py doc/v010-retro008/completed 6de6bcdbf5a315f33f19114608d78700b341992c c19aca2d13e7a2306096ef151f418fcc6ba6e2d8 38415683995
          - python3 tools/v010-deepen009/reaudit.py doc/v010-deepen009/completed 0b220daec7762254eb38a72019dc44f62c9f5a62 6f29c2bce728cba617ee2b72aa1733468891e28c 38423055308
          - python3 tools/v010-retro010/reaudit.py doc/v010-retro010/completed 536a62cb876760afcda2720b37617f1340817691 2ac3e0da431f8e88a7b7f7317aa53d29c108a12c 38667352032
          - python3 tools/v010-retro011-integration/reaudit.py doc/v010-retro011/completed 68ba0b43ec2b6761fbb3d2a75667776a497432cd 682ad7e0f9dd997348c8766c073c2fe18b9005ca 38679332213
          - python3 tools/v010-deepen012/reaudit.py doc/v010-deepen012/completed 958bd2d512468f11fa870b432c10cf231e77c968 b389875686726125e6fb30fb899e6b813cb3ec50 38734817122
          - python3 tools/v010-split013/reaudit.py doc/v010-split013/completed 590780779601115cc5af4dd31307792adf846ba1 b0bdd634dc7c31b8adc29cf07cdb92969954eb97 38863188124
          - python3 tools/v010-split014/reaudit.py doc/v010-split014/completed 972f441197148d9a7a1bce910a77ac39e1049683 23ddc84ed40041efc1afa13920cd31d7cc1e074a 39033955570
          - python3 tools/v010-table015/reaudit.py doc/v010-table015/completed 63edba242e87a5fee3dff225e464b7cd9adce739 a5c671ad0e37eaf85dc1b8e1b2d9afcf775161de 39042654147
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: ${{ matrix.command }}
  preflight:
    needs: audits
    if: startsWith(github.event.head_commit.message, 'Start v0.10.0 partition study 016') && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node -e "require('./tools/v010-partition016/verify-comparison.cjs').verify('doc/v010-partition016')"
      - run: node --expose-gc --test tools/v010-table015/method.test.cjs tools/v010-partition016/check.test.cjs
      - run: node tools/v010-partition016/study.cjs manifest
      - run: test "$(git ls-remote origin refs/heads/results/v010-partition-study-016 | cut -f1)" = "$GITHUB_SHA"
  targets:
    needs: preflight
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        root: [0, 1, 2, 3, 4, 5, 6, 7]
        target: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prove one complete legal root with FIFO table replacement with verified prior certificates
        run: node --expose-gc --max-old-space-size=4096 tools/v010-partition016/study.cjs job "$RUNNER_TEMP/proofs" "${{ matrix.root }}" "${{ matrix.target }}"
      - name: Reuse complete bytes with zero new exploration
        run: node tools/v010-partition016/study.cjs job "$RUNNER_TEMP/proofs" "${{ matrix.root }}" "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v010-partition016-${{ matrix.root }}-${{ matrix.target }}
          path: ${{ runner.temp }}/proofs/
          retention-days: 90
  aggregate:
    needs: targets
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: v010-partition016-*
          merge-multiple: true
          path: ${{ runner.temp }}/proofs
      - name: Audit all targets and five levels of quantified composition
        run: node --max-old-space-size=4096 tools/v010-partition016/study.cjs aggregate "$RUNNER_TEMP/proofs"
      - name: Preserve original bytes on precreated source branch
        env:
          STUDY_SOURCE_SHA: ${{ github.sha }}
          STUDY_RUN_ID: ${{ github.run_id }}
        run: |
          test "$(git ls-remote origin refs/heads/results/v010-partition-study-016 | cut -f1)" = "$GITHUB_SHA"
          python3 tools/v010-followup/archive.py "$RUNNER_TEMP/proofs" doc/v010-partition016/completed
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c results/v010-partition-study-016
          git add doc/v010-partition016/completed
          git commit -m 'Preserve study 016 partition proofs and original records'
          git push origin HEAD:refs/heads/results/v010-partition-study-016
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v010-partition016-summary
          path: |
            ${{ runner.temp }}/proofs/summary.json
            doc/v010-partition016/completed/
          retention-days: 90
