name: NYAKUA three-kete record verification and relay audit
on:
  push:
    branches: [experiment/nyakua-three-20261002]
    paths: ['.github/workflows/nyakua-three-report-recovery.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  verify-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/download-artifact@v4
        with:
          run-id: 36970748063
          github-token: ${{ github.token }}
          pattern: nyakua-three-*
          path: tools/nyakua-three/results
          merge-multiple: true
      - name: Verify original checks
        run: |
          node --test prototype/four-row.test.cjs
          node tools/nyakua-three/check.cjs /tmp/current-checks.json
          node -e "require('node:assert/strict').deepEqual(require('/tmp/current-checks.json'),require('./tools/nyakua-three/results/checks.json'))"
      - name: Audit all abnormal games and aggregate records
        run: |
          node tools/nyakua-three/audit.cjs
          node tools/nyakua-three/report.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: nyakua-three-final
          path: |
            tools/nyakua-three/results/
            doc/NYAKUA_THREE_STUDY_20261002.md
          retention-days: 30
      - name: Preserve investigation records
        env:
          STUDY_BRANCH: ${{ github.ref_name }}
        run: |
          test "$STUDY_BRANCH" = experiment/nyakua-three-20261002
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/nyakua-three/results doc/NYAKUA_THREE_STUDY_20261002.md
          git commit -m "docs: preserve verified comparison and relay counterexamples"
          git push origin "HEAD:$STUDY_BRANCH"
