name: v0.10.0 study 015 integration checks
on:
  pull_request:
    paths: ['tools/v010-table015/**', 'doc/V010_TABLE015_*', 'doc/v010-table015/**', '.github/workflows/v010-table015-*.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --expose-gc --test tools/v010-table015/method.test.cjs tools/v010-table015/check.test.cjs
      - run: node tools/v010-table015/study.cjs manifest
      - run: node tools/v010-table015/verify-pilot.cjs
      - run: python3 tools/v010-table015/reaudit.py doc/v010-table015/completed 63edba242e87a5fee3dff225e464b7cd9adce739 a5c671ad0e37eaf85dc1b8e1b2d9afcf775161de 39042654147
      - name: Preserve frozen sources and original bytes
        run: |
          git diff --exit-code a5c671ad0e37eaf85dc1b8e1b2d9afcf775161de -- prototype trials tools/v010-table015 doc/V010_TABLE015_PLAN_20261017.md .github/workflows/v010-table015-study.yml doc/v010-table015 ':(exclude)doc/v010-table015/completed' ':(exclude)doc/v010-table015/independent-reaudit.json'
          git diff --exit-code 63edba242e87a5fee3dff225e464b7cd9adce739 -- doc/v010-table015/completed
          git diff --check
