name: v0.10.0 study 013 integration checks
on:
  pull_request:
    paths: ['tools/v010-split013/**', 'doc/V010_SPLIT013_*', 'doc/v010-split013/**', '.github/workflows/v010-split013-*.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --expose-gc --test tools/v010-split013/check.test.cjs
      - run: node tools/v010-split013/study.cjs manifest
      - run: node tools/v010-split013/verify-pilot.cjs
      - run: python3 tools/v010-split013/reaudit.py doc/v010-split013/completed 590780779601115cc5af4dd31307792adf846ba1 b0bdd634dc7c31b8adc29cf07cdb92969954eb97 38863188124
      - name: Preserve frozen sources and original bytes
        run: |
          git diff --exit-code b0bdd634dc7c31b8adc29cf07cdb92969954eb97 -- prototype trials tools/v010-split013 doc/V010_SPLIT013_PLAN_20261016.md doc/v010-split013/pilot.json doc/v010-split013/preflight-reaudit.json doc/v010-split013/selection.json doc/v010-split013/inventory.json doc/v010-split013/preliminary-freeze .github/workflows/v010-split013-study.yml
          git diff --exit-code 590780779601115cc5af4dd31307792adf846ba1 -- doc/v010-split013/completed
          git diff --check
