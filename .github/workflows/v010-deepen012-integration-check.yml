name: v0.10.0 study 012 integration checks
on:
  pull_request:
    paths: ['tools/v010-deepen012/**', 'doc/V010_DEEPEN012_*', 'doc/v010-deepen012/**', '.github/workflows/v010-deepen012-*.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --expose-gc --test tools/v010-deepen012/check.test.cjs
      - run: node tools/v010-deepen012/study.cjs manifest
      - run: node tools/v010-deepen012/verify-pilot.cjs
      - run: python3 tools/v010-deepen012/reaudit.py doc/v010-deepen012/completed 958bd2d512468f11fa870b432c10cf231e77c968 b389875686726125e6fb30fb899e6b813cb3ec50 38734817122
      - name: Preserve frozen sources and original bytes
        run: |
          git diff --exit-code b389875686726125e6fb30fb899e6b813cb3ec50 -- prototype trials tools/v010-deepen012 doc/V010_DEEPEN012_PLAN_20261015.md doc/v010-deepen012/pilot.json doc/v010-deepen012/preflight-reaudit.json doc/v010-deepen012/selection.json .github/workflows/v010-deepen012-study.yml
          git diff --exit-code 958bd2d512468f11fa870b432c10cf231e77c968 -- doc/v010-deepen012/completed
          git diff --check
