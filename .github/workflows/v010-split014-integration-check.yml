name: v0.10.0 study 014 integration checks
on:
  pull_request:
    paths: ['tools/v010-split014/**', 'doc/V010_SPLIT014_*', 'doc/v010-split014/**', '.github/workflows/v010-split014-*.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --expose-gc --test tools/v010-split014/check.test.cjs
      - run: node tools/v010-split014/study.cjs manifest
      - run: node tools/v010-split014/verify-pilot.cjs
      - run: python3 tools/v010-split014/reaudit.py doc/v010-split014/completed 972f441197148d9a7a1bce910a77ac39e1049683 23ddc84ed40041efc1afa13920cd31d7cc1e074a 39033955570
      - name: Preserve frozen sources and original bytes
        run: |
          git diff --exit-code 23ddc84ed40041efc1afa13920cd31d7cc1e074a -- prototype trials tools/v010-split014 doc/V010_SPLIT014_PLAN_20261017.md doc/v010-split014/pilot.json doc/v010-split014/preflight-reaudit.json doc/v010-split014/selection.json doc/v010-split014/inventory.json doc/v010-split014/preliminary-pilot doc/v010-split014/preliminary-check.log.gz doc/v010-split014/preliminary-check-receipt.json doc/v010-split014/check.log doc/v010-split014/check-initial.log doc/v010-split014/preflight-logs doc/v010-split014/verify-pilot.json .github/workflows/v010-split014-study.yml
          git diff --exit-code 972f441197148d9a7a1bce910a77ac39e1049683 -- doc/v010-split014/completed
          git diff --check
