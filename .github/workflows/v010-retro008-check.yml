name: v0.10.0 retrograde study 008 checks
on:
  pull_request:
    paths: ['tools/v010-retro008/**', 'doc/V010_RETRO008_*', 'doc/v010-retro008/**', '.github/workflows/v010-retro008-*.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --expose-gc --test tools/v010-retro008/check.test.cjs
      - run: node tools/v010-retro008/study.cjs manifest
      - run: node tools/v010-retro008/verify-pilot.cjs
      - run: python3 tools/v010-pn007/reaudit.py doc/v010-pn007/completed 5f44f34a3a279b232d3045b5b3edaad48096ac0d ce52d57f4a25d40664f1e12de8559691577af1c0 38313259149
      - name: Frozen original evidence and public implementation are unchanged
        run: |
          git diff --exit-code c68ce45da0c9ad11051207a6c230562422545d00 -- prototype trials tools/v010-balance tools/v010-followup tools/v010-certainty tools/v010-gc tools/v010-branch tools/v010-reply tools/v010-deepen tools/v010-pn tools/v010-pn007 doc/v010-research-completed doc/v010-balance doc/v010-followup doc/v010-certainty doc/v010-gc doc/v010-branch doc/v010-reply doc/v010-deepen doc/v010-pn doc/v010-pn007
          git diff --check
