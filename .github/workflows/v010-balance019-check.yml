name: v0.10.0 study019 integration checks
on:
  push:
    branches: ['research/v010-balance019-20261019']
  pull_request:
    paths: ['tools/v010-balance019/**', 'doc/v010-balance019/**', '.github/workflows/v010-balance019-*.yml']
permissions:
  contents: read
jobs:
  check019:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tools/v010-balance019/check.test.cjs
      - run: git diff --check
